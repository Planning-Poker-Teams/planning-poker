services:
  ministack:
    container_name: "${MINISTACK_DOCKER_NAME:-planning-poker-ministack}"
    image: ministackorg/ministack:1.3.17
    ports:
      - "4566:4566"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      PERSIST_STATE: "1"
      STATE_DIR: "/tmp/ministack-state"
      MINISTACK_REGION: "${MINISTACK_REGION:-eu-central-1}"
      LAMBDA_EXECUTOR: "docker"
      DOCKER_NETWORK: "planning-poker-local"
    volumes:
      - "./.local/ministack/state:/tmp/ministack-state"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - local-cloud

networks:
  local-cloud:
    name: planning-poker-local
